[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chongqing-watershed-mcp"
version = "1.0"
description = "Agent and MCP services for spatial processing, rainfall-runoff and slope-stability modelling in Chongqing"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "numpy>=1.26",
  "scipy>=1.11",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "pyogrio>=0.7",
  "pyshp>=2.3,<4",
  "pandas>=2.0",
  "matplotlib>=3.8",
  # Excel export writes real .xlsx workbooks; stated explicitly so the engine
  # does not depend on which optional writers pandas happens to find.
  "openpyxl>=3.1,<4",
]

[project.scripts]
chongqing-spatial-mcp = "chongqing_spatial_mcp.server:main"
watershed-hydro-stability-mcp = "watershed_hydro_mcp.server:main"
slope-evaluation-agent = "slope_evaluation_agent.cli:main"
slope-evaluation-web = "slope_evaluation_agent.web:main"

[project.optional-dependencies]
# GRASS is optional: the native Priority-Flood + D8 path is the default.
grass = []
test = ["pytest>=8", "pytest-asyncio>=0.24"]
# The agent talks to an OpenAI-compatible endpoint over plain HTTP; installed
# only when the optional language-model path is used.
llm = ["httpx>=0.27"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watershed_hydro_mcp = ["core/**/*.py"]
slope_evaluation_agent = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The agent's MCP clients are async; mark them explicitly rather than relying
# on auto-detection, so a sync test is never silently skipped.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "asyncio: async test driven by pytest-asyncio",
  "unit: no external process involved",
  "integration: drives the real services in-process",
  "real_mcp: starts the real MCP services",
  "windows_process: depends on Windows process semantics",
  "llm_contract: constrains what a language model may do",
]
